<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Verify Email</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9;">
  <div style="max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px;">
    <h2>Hello {{username}},</h2>
    <p>Thank you for registering. Please verify your email by clicking below:</p>
    <a href="{{verificationLink}}" style="display:inline-block; padding: 12px 20px; background-color:#007bff; color:#fff; text-decoration:none; border-radius:5px;">
      Verify Email
    </a>
    <p>If the button doesn’t work, copy and paste this link into your browser:</p>
    <p>{{verificationLink}}</p>
    <p>If you didn’t request this, you can safely ignore this email.</p>
  </div>
</body>
</html>
